# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Secrets marked `sync: false`
# are asked for once in the dashboard; they're never stored in this file.
#
# The simulator reads server/data/clean/ from the repo, so server/data/clean/ must be committed.
# Free web services sleep after inactivity, which stops the tick loop - use a paid instance
# (plan: starter) for anything you demo.

services:
  - type: web
    name: vitals-simulator
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # --demo: scripted sepsis + false alarm, 1 reading every 2 s.
    # SIM_SPEED = hospital seconds per real second (change it in the Render dashboard, then redeploy):
    #   450 = demo default (2 s = 15 min: sepsis at 8 s, fully developed ~40 s)
    #    60 = 2 s = 2 min (sepsis at 1 min, fully developed ~5 min, false alarm at 2.5 min)
    #     1 = real time
    # Add --reset to clear Supabase vitals/alerts on every start (including restarts/deploys).
    startCommand: python server/sim/cli.py serve --demo --speed ${SIM_SPEED:-60} --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SIM_SEED
        value: "1984"
      - key: SIM_SPEED
        value: "60"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Required for the POST demo controls (trigger/oxygen/...): send `Authorization: Bearer <token>`.
      - key: SIM_CONTROL_TOKEN
        generateValue: true

  # NEWS2 alert worker: polls `vitals` every 1 s (latest reading per patient), writes `alerts`.
  - type: worker
    name: news2-alert-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python server/news2/alert_worker.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
